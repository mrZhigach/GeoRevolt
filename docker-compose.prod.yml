version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://georevolt:${DB_PASSWORD:-georevolt}@db:5432/georevolt
      - NEXT_PUBLIC_MARKET_FACTORY_ADDRESS=${NEXT_PUBLIC_MARKET_FACTORY_ADDRESS}
      - NEXT_PUBLIC_MOCK_USDC_ADDRESS=${NEXT_PUBLIC_MOCK_USDC_ADDRESS}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: georevolt
      POSTGRES_PASSWORD: ${DB_PASSWORD:-georevolt}
      POSTGRES_DB: georevolt
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georevolt -d georevolt"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg-data:
